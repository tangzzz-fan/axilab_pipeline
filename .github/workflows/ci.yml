name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parity-tests:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: algo-engineering-lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Python deps
        run: uv sync

      - name: Swift parity tests
        run: swift test --filter ParityTests
